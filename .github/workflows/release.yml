name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  upload-zip:
    name: Attach integration ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create integration ZIP
        working-directory: custom_components/fritzbox_calllist
        run: zip -r "${{ github.workspace }}/fritzbox_calllist.zip" .

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ github.event.release.tag_name }}"
          fritzbox_calllist.zip
          --clobber
